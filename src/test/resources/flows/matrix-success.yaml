id: matrix-success
namespace: io.kestra.tests

inputs:
  - id: url
    type: STRING
    defaults: "MATRIX_TEST_URL"

tasks:
  - id: matrix
    type: io.kestra.plugin.matrix.Execution
    homeserverUrl: "{{ inputs.url }}"
    accessToken: "token"
    roomId: "!room:example.org"
    msgtype: NOTICE
    executionId: "{{trigger.executionId}}"
    customMessage: "nightly batch finished"
    customFields:
      env: qa

triggers:
  - id: on_success
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: flow_trigger
      flows:
        - namespace: io.kestra.tests
          flowId: main-flow-that-succeeds
          states: [ SUCCESS ]
